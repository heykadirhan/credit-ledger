name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # The API tests download a MongoDB binary on first run (about 80 MB).
      - run: npm test
      - run: npm run build -w api
      - run: npm run build -w web
